# VPN-only access control. Restricts a router to tailnet/on-host traffic; the
# public internet gets 403. Attach via label:
#   - "traefik.http.routers.<name>.middlewares=vpn-only@file"
#
# Docker SNATs tailnet/loopback traffic to the smc-traefik gateway (172.18.0.1)
# before Traefik sees it, so we allow that gateway; public traffic keeps its real
# source IP and stays blocked. Update 172.18.0.1 if the network's subnet changes.
http:
  middlewares:
    vpn-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"   # Tailscale CGNAT range
          - "127.0.0.1/32"    # on-host curl checks
          - "172.18.0.1/32"   # smc-traefik bridge gateway
