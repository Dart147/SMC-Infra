global:
  scrape_interval: 30s
  evaluation_interval: 15s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
        
# Load alert rules
# Infrastructure and project-specific rules from rules/
rule_files:
  - "/etc/prometheus/base/rules/*.yaml"
  - "/etc/prometheus/base/rules/node-exporter/*.yaml"
  # - "/etc/prometheus/rules/*.yaml" -> TODO: Add project-specific rules

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "Prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "SMC-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["smc-backend:8081"]
        labels:
          project: SMC
          env: prod
          service: SMC App
          component: backend
          source: whitebox
          manager: "Destrier"

  # Blackbox exporter for external service health checks with file-based target discovery
  # Load targets from infra/ and directories
  - job_name: 'Blackbox-Exporter'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      # Infrastructure and project-specific targets
      # Pattern matches: targets/infra/*.yaml and targets/<project>/*.yaml
      - files:
          - /etc/prometheus/targets/*.yaml
        refresh_interval: 30s
    relabel_configs:
      # Use the targets from the file as the probe target
      - source_labels: [__address__]
        target_label: __param_target
      # Keep the original target as the instance label for identification
      - source_labels: [__param_target]
        target_label: instance
      # Scrape blackbox via the tailscale
      - target_label: __address__
        replacement: tailscale-probe:9115
  
  # Alertmanager for managing and dispatching alerts
  - job_name: "Alertmanager"
    metrics_path: /metrics
    static_configs:
      - targets: ["alertmanager:9093"]
  
  # Node exporter for scraping hardware metrics
  - job_name: "Node-Exporter"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node-exporter/*.yaml
        refresh_interval: 30s
    metrics_path: /metrics
    relabel_configs:
      # Extract IP address from __address__ (format: IP:port)
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: ip
        replacement: '${1}'
      # Extract port from __address__ (format: IP:port)
      - source_labels: [__address__]
        regex: '[^:]+:(.*)'
        target_label: port
        replacement: '${1}'
        