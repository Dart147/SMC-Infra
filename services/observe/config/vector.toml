# vector.toml

[api]
enabled = true          # required by the compose healthcheck on :8686

[sources.docker_logs]
type = "docker_logs"
include_labels = [ "vector.enable=true" ]

[transforms.parse_logs_to_json]
type = "remap"
inputs = [ "docker_logs" ]
source = '''
. = parse_json!(.message)
'''

[sinks.to_loki]
type = "loki"
inputs = ["parse_logs_to_json"]
encoding.codec = "json"
endpoint = "http://loki:3100"
labels = {level = "{{ level }}", app = "{{ app_name }}", version = "{{ version }}", env = "{{ env }}"}

# For Debug: Print every log line into Vector's own container logs, 
# so`docker logs vector` shows what is being sent to Loki
[sinks.to_console]
type = "console"
inputs = ["parse_logs_to_json"]
encoding.codec = "json"