server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

# Tempo 3.0 removed the ingester write-path; Traces now live in live_store
live_store:
  max_trace_idle: 10s
  max_block_duration: 5m

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-data
      endpoint: minio:9000
      access_key: ${TEMPO_S3_ACCESS_KEY}
      secret_key: ${TEMPO_S3_SECRET_KEY}
      insecure: true

# Tempo 3.0 removed the standalone compactor; retention is now driven by
# backend_scheduler (generates retention jobs) + backend_worker (executes them),
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 2160h  # 90 days
