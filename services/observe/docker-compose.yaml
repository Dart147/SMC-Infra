services:
  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki
      - tempo
      - prometheus
      - blackbox-exporter
      - alertmanager
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
    networks:
      - traefik
      - observe-net
    volumes:
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      # Future dashboards layout
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml
    # no health check before 3.6.5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`${PROMETHEUS_HOST}`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.routers.loki.tls.certresolver=cloudflare"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.http.routers.loki.middlewares=vpn-only@file"
    networks:
      - observe-net
      - traefik

  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    restart: unless-stopped
    command: ["--config.file=/etc/tempo.yaml"]
    ports:
      - "4317:4317"     # gRPC for OTLP
      - "4318:4318"     # OTLP HTTP receiver
      - "3200:3200"     # Tempo internal HTTP server (for Grafana)
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`${PROMETHEUS_HOST}`)"
      - "traefik.http.routers.tempo.entrypoints=websecure"
      - "traefik.http.routers.tempo.tls=true"
      - "traefik.http.routers.tempo.tls.certresolver=cloudflare"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
      - "traefik.http.routers.tempo.middlewares=vpn-only@file"
    networks:
      - traefik
      - observe-net

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/base:/etc/prometheus/base:ro
      - ./config/prometheus/targets:/etc/prometheus/targets:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/base/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_HOST}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=cloudflare"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=vpn-only@file"
    networks:
      - traefik
      - observe-net
    depends_on:
      - blackbox-exporter
      - alertmanager

  # Tailscale sidecar: gives blackbox-exporter a tailnet identity so it can probe vpn-only subdomains.
  # Shared net namespace gets a real tailscale0 interface for transparent routing.
  tailscale-probe:
    image: tailscale/tailscale:v1.98.4
    container_name: tailscale-probe
    hostname: blackbox-probe              # tailnet node name
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # Uncomment if ACL uses tags (declare tag:monitoring in tagOwners)
      # - TS_EXTRA_ARGS=--advertise-tags=tag:monitoring
    devices:
      - /dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    volumes:
      - tailscale-probe-state:/var/lib/tailscale
    # blackbox's :9115 is reachable inside this shared network.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blackbox-exporter.rule=Host(`${BLACKBOX_EXPORTER_HOST}`)"
      - "traefik.http.routers.blackbox-exporter.entrypoints=websecure"
      - "traefik.http.routers.blackbox-exporter.tls=true"
      - "traefik.http.routers.blackbox-exporter.tls.certresolver=cloudflare"
      - "traefik.http.services.blackbox-exporter.loadbalancer.server.port=9115"
      - "traefik.http.routers.blackbox-exporter.middlewares=vpn-only@file"
    networks:
      - traefik
      - observe-net

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    # Share the sidecar's network namespace → all probe egress routes over the tailnet.
    network_mode: service:tailscale-probe
    depends_on:
      - tailscale-probe
    volumes:
      - ./config/prometheus/base/blackbox.yaml:/config/blackbox.yaml:ro
    command:
      - '--config.file=/config/blackbox.yaml'
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9115/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./config/prometheus/base/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
      - ./config/prometheus/secrets:/etc/alertmanager/secrets:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yaml'
      - '--storage.path=/alertmanager'
      - '--log.level=debug'
    environment:
      - TZ=Asia/Taipei
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.alertmanager.rule=Host(`${ALERTMANAGER_HOST}`)"
        - "traefik.http.routers.alertmanager.entrypoints=websecure"
        - "traefik.http.routers.alertmanager.tls=true"
        - "traefik.http.routers.alertmanager.tls.certresolver=cloudflare"
        - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
        - "traefik.http.routers.alertmanager.middlewares=vpn-only@file"
    networks:
        - traefik
        - observe-net
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro    # Read system process info
      - /sys:/host/sys:ro      # Read system info
      - /:/rootfs:ro           # Read filesystem info
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9100 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.node-exporter.rule=Host(`${NODE_EXPORTER_HOST}`)"
      - "traefik.http.routers.node-exporter.entrypoints=websecure"
      - "traefik.http.routers.node-exporter.tls=true"
      - "traefik.http.routers.node-exporter.tls.certresolver=cloudflare"
      - "traefik.http.services.node-exporter.loadbalancer.server.port=9100"
      - "traefik.http.routers.node-exporter.middlewares=vpn-only@file"
    networks:
      - traefik
      - observe-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`${MINIO_HOST}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.tls.certresolver=cloudflare"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio.middlewares=vpn-only@file"
    networks:
      - traefik
      - observe-net

  setup-minio:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: setup-minio
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        sleep 5 &&
        mc alias set local http://minio:9000 admin password123 &&
        mc mb --ignore-existing local/loki-data &&
        mc mb --ignore-existing local/tempo-data &&
        mc ilm add local/loki-data --expiry-days 90 &&
        mc ilm add local/tempo-data --expiry-days 90 &&
        exit 0;
      "
    networks:
      - observe-net


volumes:
  minio-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  tailscale-probe-state:

networks:
  traefik:
    external: true
  observe-net:
